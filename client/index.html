<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>乱世枭雄</title></head><body>
<div id="app">
  <div id="connBar"><span id="conn" class="conn bad">断开</span></div>
  <div id="connBanner" class="conn-banner hidden"></div>
  <div id="accountBar" class="account-bar"></div>
  <div id="toast" class="hidden"></div>

  <!-- ===== 大厅（居中）===== -->
  <div id="lobby" class="panel lobby">
    <div class="lobby-title">⚔ 乱世枭雄</div>
    <div class="form-row"><input id="playerName" placeholder="你的昵称" maxlength="8" value="玩家"></div>
    <div class="btn-group">
      <button id="btnCreate" class="primary">🏠 创建房间</button>
      <button id="btnCreateSandbox" class="secondary">🧪 测试沙盒</button>
    </div>
    <div class="divider">— 或加入已有房间 —</div>
    <div class="form-row" style="justify-content:center"><input id="joinId" placeholder="6位房间号" maxlength="6" style="text-transform:uppercase;width:160px;text-align:center"><button id="btnJoin" class="primary">🔑 加入</button></div>
    <div id="bookmarksPanel" class="bookmarks-panel hidden">
      <div class="bm-title">📌 我的房间码书签</div>
      <div id="bookmarkList" class="bm-list"></div>
    </div>
  </div>

  <!-- ===== 房间（含游戏配置）===== -->
  <div id="room" class="panel hidden">
    <div class="top-row">
      <button id="btnBackHomeFromRoom" class="ghost">← 返回</button>
      <span class="room-id" id="roomId"></span>
      <button id="btnCopy" class="ghost" title="复制房间号">📋</button>
      <button id="btnBookmark" class="ghost" title="收藏此房间码">📌</button>
    </div>

    <!-- 游戏配置 -->
    <div id="configRow" class="config-section">
      <div class="config-title">⚙ 游戏配置</div>
      <div class="form-row">
        <label>对局人数</label>
        <select id="cfgPlayerCount">
          <option value="2">2人</option><option value="3">3人</option><option value="4">4人</option>
          <option value="5">5人</option><option value="6">6人</option><option value="7">7人</option>
          <option value="8">8人</option><option value="9">9人</option><option value="10" selected>10人</option>
        </select>
        <label>对战模式</label>
        <select id="cfgFightMode">
          <option value="open">明斗（公开出拳）</option>
          <option value="secret">暗斗（隐藏出拳）</option>
        </select>
        <button id="btnApplyConfig" class="primary small">确定</button>
      </div>
    </div>

    <div class="form-row"><label>元素集</label>
      <div id="setSeg">
        <span class="seg-btn active" data-set="five">五元（数/物/化/生/计）</span>
        <span class="seg-btn" data-set="three">三元（石头/剪刀/布）</span>
      </div>
    </div>

    <p id="roomHint" class="hint"></p>
    <div id="hostRow">
      <div class="form-row">
        <select id="botHero"></select>
        <button id="btnBot">加机器人</button>
        <button id="btnBotAddAll" class="ghost">一键全加</button>
        <button id="btnBotRemoveAll" class="ghost">一键全删</button>
      </div>
    </div>
    <div id="memberList" class="member-list"></div>
    <div class="btn-row"><button id="btnStart" class="primary big">⚔ 开始游戏</button></div>
  </div>

  <!-- ===== 游戏 ===== -->
  <div id="game" class="hidden game">
    <div id="topBar">
      <button id="btnBackRoom" class="ghost" title="返回房间">←返回</button>
      <div id="turnInfo">——</div>
      <div class="top-right">
        <div id="timerWrap" class="hidden timer-wrap"><div class="timer-bar"><i id="timerFill"></i></div><span id="timerLabel"></span></div>
        <button id="btnPause" class="ghost" title="暂停">⏸</button>
        <button id="btnResume" class="ghost hidden" title="继续">▶</button>
        <button id="btnToggleLog" class="ghost" title="显示/隐藏日志">📜</button>
      </div>
    </div>
    <div id="roundBanner" class="hidden round-banner"></div>
    <div id="eventBanner" class="hidden event-banner"></div>
    <div id="board" class="board"></div>
    <div id="throwPanel" class="panel hidden throw-panel"><div class="panel-title">✊ 出拳</div><div id="throwBtns" class="btn-row"></div></div>
    <div id="waitPanel" class="panel hidden wait-panel"><div id="waitTitle">⏳ 等待</div></div>
    <div id="actionPanel" class="panel hidden action-bar">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span id="targetText" class="target-text">👆 点对方卡牌</span>
        <span id="mineStatus" style="display:none;font-size:12px;color:var(--accent2)"></span>
      </div>
      <div class="btn-row" id="actionBtns"></div>
    </div>
    <div id="sandboxPanel" class="panel hidden action-bar">
      <div class="panel-title">🧪 配置行动 → 结算</div>
      <div id="sandboxActors" class="actor-row"></div>
      <span id="sandboxMineStatus" style="display:none;font-size:12px;color:var(--accent2);margin-bottom:4px"></span>
      <div class="btn-row" id="sandboxBtns"></div>
      <div id="sandboxFtRow" class="hidden followup-row"><label>剑客追加:</label><select id="sandboxFtSel"></select></div>
      <button id="btnApplySandbox" class="primary big" style="margin-top:6px">✅ 结算</button>
    </div>
    <div id="logBox" class="log-box hidden"></div>
  </div>
  <div id="pauseOverlay" class="overlay hidden"><div class="box"><div class="big">⏸ 已暂停</div></div></div>

  <!-- ===== 登录 / 注册 ===== -->
  <div id="authModal" class="overlay hidden">
    <div class="modal-box auth-modal">
      <div class="modal-title" id="authTitle">登录</div>
      <div class="form-row"><input id="authUser" placeholder="用户名（3-20位中英文/数字/下划线）" maxlength="20" autocomplete="username"></div>
      <div class="form-row"><input id="authPass" type="password" placeholder="密码（6-64位）" maxlength="64" autocomplete="current-password"></div>
      <div id="authErr" class="auth-err"></div>
      <div class="btn-row" style="justify-content:center;gap:10px;margin-top:6px">
        <button id="btnAuthSubmit" class="primary">登录</button>
        <button id="btnAuthToggle" class="ghost">去注册</button>
      </div>
      <div class="hint" style="text-align:center;margin-top:10px">游客可直接用昵称进房；登录后战绩才会保存</div>
    </div>
  </div>

  <!-- ===== 档案页（#18 Phase4）===== -->
  <div id="profile" class="panel hidden">
    <div class="top-row">
      <button id="btnProfileBack" class="ghost">← 返回</button>
      <span class="room-id">📊 我的档案</span>
    </div>
    <div id="profileBody" class="profile-body"></div>
  </div>

  <!-- ===== 回放播放器（#18 Phase4）===== -->
  <div id="replay" class="panel hidden">
    <div class="top-row">
      <button id="btnReplayBack" class="ghost">← 返回档案</button>
      <span class="room-id" id="replayTitle">🎬 对局回放</span>
    </div>
    <div class="replay-body">
      <div id="replayBoard" class="board replay-board"></div>
      <div class="replay-side">
        <div class="replay-controls">
          <button id="btnReplayPrev" class="ghost small">⏮ 上一步</button>
          <button id="btnReplayPlay" class="ghost small">▶ 播放</button>
          <button id="btnReplayNext" class="ghost small">下一步 ⏭</button>
          <span id="replayTurnLabel" class="replay-turn"></span>
        </div>
        <input id="replayScrub" type="range" min="0" max="0" value="0" class="replay-scrub">
        <div id="replayRoundInfo" class="replay-roundinfo"></div>
        <div id="replayLog" class="replay-log"></div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script></body></html>
